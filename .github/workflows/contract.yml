name: Contract conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VV_AGENT_RUN_LIVE_TESTS: "0"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify vendored contract snapshot
        run: python3 scripts/contract_snapshot.py check

      - name: Verify freeze tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run maintenance full gate
        env:
          VV_AGENT_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/15
        run: |
          cargo fmt --all -- --check
          cargo test -p vv-agent -- --test-threads=1
          cargo test -p vv-agent --features apalis --test apalis_backend
          cargo clippy --all-targets --all-features -- -D warnings
