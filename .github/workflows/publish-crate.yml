name: Publish crate

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish vv-agent to crates.io
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    environment: crates-io
    env:
      VV_AGENT_RUN_LIVE_TESTS: "0"
      VV_AGENT_TEST_REDIS_URL: redis://127.0.0.1:6399/15
      CARGO_BUILD_JOBS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Verify release tag and crate version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git check-ref-format --allow-onelevel "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Release tag $RELEASE_TAG resolves to $tag_commit, but checkout is $head_commit" >&2
            exit 1
          fi
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("crates/vv-agent/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])
          PY
          )"
          if [ -z "$version" ] || [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "Release tag $RELEASE_TAG does not match vv-agent version $version" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify locked contract snapshot
        run: python3 scripts/contract_snapshot.py check

      - name: Require centrally verified contract adoption
        run: python3 scripts/contract_snapshot.py adoption --implementation rust --revision "$(git rev-parse HEAD)"

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test -p vv-agent -- --test-threads=1

      - name: Apalis backend test
        run: cargo test -p vv-agent --features apalis --test apalis_backend

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Package dry run
        run: cargo publish --manifest-path crates/vv-agent/Cargo.toml --dry-run

      - name: Publish
        run: cargo publish --manifest-path crates/vv-agent/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
